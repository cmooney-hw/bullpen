<!doctype html>
<html><head><meta charset="utf-8"><title>Meeting set</title>
<style>
:root{--bg:#0f1318;--fg:#e8ecf1;--muted:#9aa4b2;--good:#46c08a;--line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.07);--pop:#1b222a}
html[data-theme="obsidian"]{--pop:#22141a}
html[data-theme="clear"]{--pop:#ffffff;--fg:#14181f;--muted:#5b6673;--line:rgba(0,0,0,.1);--line-soft:rgba(0,0,0,.07)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--fg);overflow:hidden}
.cele{position:fixed;inset:0;background:rgba(6,8,14,.82);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(-8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.card{position:relative;width:min(80vw,900px);background:var(--pop);border:1px solid rgba(70,192,138,.5);border-radius:22px;box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 8px rgba(70,192,138,.12);padding:28px 32px 0;animation:pop .35s ease}
.card b{display:block;font-size:clamp(24px,3.2vw,40px);color:var(--good);margin-bottom:6px;padding-right:40px}
.card p{margin:0;font-size:clamp(15px,1.6vw,22px);white-space:pre-wrap}
.card .x{all:unset;cursor:pointer;position:absolute;top:14px;right:18px;color:var(--muted);font-size:28px;padding:2px 8px}
.arena{position:relative;height:clamp(140px,22vh,240px);margin:16px -32px 0;border-top:1px solid var(--line-soft);overflow:hidden;border-radius:0 0 22px 22px;background:rgba(70,192,138,.08)}
.arena .stage{right:40px;width:70%;max-width:none}
.arena .wall{width:8%;min-width:50px;right:24px;top:10%;bottom:10%}
.arena .runner{width:clamp(90px,15vw,170px);height:auto;aspect-ratio:100/64;margin-top:0;transform:translateY(-50%)}
.arena .runner svg{width:100%;height:100%}
/* bull-through-the-wall animation on the right side of the banner */
.stage{position:absolute;z-index:1;top:0;bottom:0;right:28px;width:46%;max-width:420px;min-width:170px;pointer-events:none}
.wall{position:absolute;right:18px;top:8%;bottom:8%;width:34px;display:grid;grid-template-rows:repeat(6,1fr);gap:2px}
.wall i{display:block;background:#b4553a;border-radius:2px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.3);animation:brick 1.1s cubic-bezier(.2,.7,.3,1) 1.35s forwards}
.wall i:nth-child(odd){background:#c96a4c}
@keyframes brick{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.runner{position:absolute;left:0;top:50%;width:56px;height:36px;margin-top:-18px;animation:charge 1.35s cubic-bezier(.5,0,.9,.4) forwards, through .5s ease-out 1.35s forwards}
.runner svg{width:56px;height:36px;display:block;animation:gallop .22s ease-in-out infinite}
@keyframes charge{from{left:-60px}to{left:calc(100% - 70px)}}
@keyframes through{from{left:calc(100% - 70px)}to{left:calc(100% - 46px)}}
@keyframes gallop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
.shake{animation:shake .4s ease 1.35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}60%{transform:translate(2px,1px)}80%{transform:translate(-2px,-1px)}}
.dust{position:absolute;right:30px;top:50%;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);opacity:0;animation:dust .8s ease-out 1.35s forwards}
@keyframes dust{0%{opacity:0;transform:scale(.2)}20%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}

.arena .runner{animation-name:chargeBig,throughBig}
@keyframes chargeBig{from{left:-200px}to{left:calc(100% - 260px)}}
@keyframes throughBig{from{left:calc(100% - 260px)}to{left:calc(100% - 215px)}}
@media (prefers-reduced-motion:reduce){.runner,.runner svg,.wall i,.dust,.shake{animation:none}.runner{left:calc(100% - 46px)}}
</style></head><body>
<div class="cele" id="cele"><div class="card" id="card"><b id="t"></b><button class="x" id="x" aria-label="Dismiss">×</button><p id="b"></p><div class="arena" id="arena"></div></div></div>
<template id="bull"><svg viewBox="0 0 100 64" >
  <g class="far-hind"><path d="M16 38 L24 42 L19 49 L12.5 55 L9 53.5 L14.5 47 Z" fill="#a8282e"/><path d="M8.7 53.1 L12.8 55.1 L11.5 57.5 L7.5 55.5 Z" fill="#2a0e10"/></g>
  <g class="far-front"><path d="M65 43 L72 44 L78 51.5 L81 58 L77 59.2 L73.8 52.8 Z" fill="#a8282e"/><path d="M76.9 58.6 L81.3 57.6 L81.9 60.2 L77.3 61 Z" fill="#2a0e10"/></g>
  <path d="M17.5 26 C 11.5 23.5, 8.5 17, 9.5 8.5" fill="none" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M9.5 10 C 6.5 7.5, 7.5 3.5, 9 1.5 C 9.5 4, 11.5 5.5, 11.5 7.5 C 11.5 9.5, 10.5 10.5, 9.5 10 Z" fill="#c43a40"/>
  <path fill="#e5484d" d="M18 25 C 30 18, 44 12, 56 9.5 C 64 7.5, 72 8.5, 78 12.5 C 82 14.5, 85 17, 87 19.5 C 90.5 22.5, 93 28, 93.5 33 C 94 37, 91.5 39.5, 88 39 C 85 38.5, 83 37, 81 35.5 C 78 39, 75 43, 71 45.5 C 67.5 47.5, 63 47.5, 59.5 46 C 53 45, 47 43, 41 40.5 C 38 43, 35 46, 30 47 C 23 48, 16 44, 13.5 37 C 12 32, 13.5 27, 18 25 Z"/>
  <path d="M84 22 L78.5 20 L82.5 25.8 Z" fill="#c43a40"/>
  <path d="M83 18 C 85 13, 88 11, 92 11 C 89 12.5, 87 15, 86 19 Z" fill="#d9cdb8"/>
  <path d="M86 20.5 C 89 15.5, 94 13.5, 99 14.5 C 95 16, 92 18.5, 90 22.5 Z" fill="#efe6d6"/>
  <circle cx="89" cy="26.5" r="1" fill="#1a0d0e"/>
  <circle cx="92.6" cy="35.5" r="0.8" fill="#7d1d22"/>
  <g class="near-hind"><path d="M23 39 L33 42 L28.5 49 L30 57 L25.5 58 L24 49.5 L20 45 Z" fill="#e5484d"/><path d="M25.3 57 L30.2 56.6 L30.4 59.4 L25.4 59.6 Z" fill="#2a0e10"/></g>
  <g class="near-front"><path d="M59.5 43 L67.5 44 L75 50.5 L73.2 54.5 L66.5 56.8 L64.6 53.8 L69.4 51.4 Z" fill="#e5484d"/><path d="M64.4 53.6 L66.8 57 L64 58.4 L62.4 55.4 Z" fill="#2a0e10"/></g>
</svg></template>
<script>
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
function bullStage(){
  const stage=el("div","stage"), wall=el("div","wall");
  for(let i=0;i<6;i++){const b=el("i");const dir=i%2?1:-1;b.style.setProperty("--dx",(60+Math.random()*120)+"px");b.style.setProperty("--dy",(dir*(30+Math.random()*70))+"px");b.style.setProperty("--rot",(dir*(90+Math.random()*180))+"deg");b.style.animationDelay=(1.35+Math.random()*0.12)+"s";wall.append(b);}
  for(let i=0;i<6;i++){const p=el("span","dust");const a=-Math.PI/2+(i/5)*Math.PI;p.style.setProperty("--dx",(Math.cos(a)*80)+"px");p.style.setProperty("--dy",(Math.sin(a)*60)+"px");stage.append(p);}
  const runner=el("div","runner"); runner.append(document.getElementById("bull").content.firstElementChild.cloneNode(true));
  stage.append(wall,runner); stage.classList.add("shake"); return stage;
}
let loop=null;
function show(a){
  document.documentElement.setAttribute("data-theme",a.theme||"original");
  document.getElementById("t").textContent=a.title; document.getElementById("b").textContent=a.body;
  const arena=document.getElementById("arena"); arena.replaceChildren(); let stage=bullStage(); arena.append(stage);
  clearInterval(loop); loop=setInterval(()=>{stage.remove();stage=bullStage();arena.append(stage);},3000);
}
const close=()=>board.celeClose();
document.getElementById("x").onclick=close;
document.getElementById("cele").addEventListener("click",e=>{if(e.target.id==="cele")close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
board.onCele(show);
</script></body></html>
